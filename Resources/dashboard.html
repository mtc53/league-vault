<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>__LV_TITLE__</title>
<link rel="icon" href="https://raw.communitydragon.org/latest/game/assets/ux/summonericons/profileicon6923.png">
<style>
:root{
  --bg:#06060b;
  --bg-2:#0a0a12;
  --panel:#0f101a;
  --panel-2:#141525;
  --line:#20223a;
  --line-soft:#191b2e;
  --text:#e9eaf5;
  --muted:#8b90ab;
  --dim:#5f6480;
  --accent:#ff3d8b;
  --accent-soft:rgba(255,61,139,.14);
  --good:#2fd6a3;
  --warn:#f5a524;
  --bad:#ff4d5e;
  --iron:#7a7570; --bronze:#ad7248; --silver:#98a3ae; --gold:#d4a843;
  --platinum:#4aaeb3; --emerald:#3dae72; --diamond:#6b8ce6; --master:#a166d9;
  --grandmaster:#d45254; --challenger:#5cbfeb; --unranked:#8c8f9c;
  --r:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:18px;
  padding:0 22px;height:56px;
  background:rgba(6,6,11,.82);
  backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.brand img{width:26px;height:26px;border-radius:8px;border:1px solid var(--line)}
.brand span{font-size:15px}
.brand small{
  font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;padding-left:10px;margin-left:4px;border-left:1px solid var(--line);
}
.topbar .spacer{flex:1}
.stamp{font:11px/1 var(--mono);color:var(--dim);text-align:right}
.stamp b{display:block;color:var(--muted);font-weight:600;margin-bottom:3px}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  padding:34px 22px 26px;
  border-bottom:1px solid var(--line-soft);
  background:
    radial-gradient(900px 320px at 12% -30%, rgba(255,61,139,.20), transparent 70%),
    radial-gradient(760px 300px at 88% -10%, rgba(80,110,255,.16), transparent 70%),
    linear-gradient(180deg,#0b0c18,var(--bg));
}
.hero h1{
  margin:0;font-size:clamp(22px,3.4vw,34px);font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;
}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .sub{margin-top:8px;color:var(--muted);font-size:13px;max-width:62ch}
.totals{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.total{
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:10px;padding:9px 13px;min-width:104px;
}
.total b{display:block;font:600 17px/1.2 var(--mono);letter-spacing:-.01em}
.total span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}

/* ---------- controls ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:0 22px 64px}
.controls{
  position:sticky;top:56px;z-index:30;
  margin:0 -22px 20px;padding:16px 22px 14px;
  background:rgba(6,6,11,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.searchrow{display:flex;gap:10px;align-items:center}
.search{position:relative;flex:1}
.search input{
  width:100%;height:42px;padding:0 14px 0 38px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-size:13px;outline:none;
}
.search input:focus{border-color:#3a3d63;box-shadow:0 0 0 3px rgba(255,61,139,.10)}
.search svg{position:absolute;left:13px;top:13px;width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2}
.viewtoggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;height:42px}
.viewtoggle button{
  background:none;border:0;border-radius:7px;width:40px;display:grid;place-items:center;color:var(--dim)
}
.viewtoggle button.on{background:var(--panel-2);color:var(--text)}
.viewtoggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
select{
  height:42px;padding:0 30px 0 12px;
  background:var(--panel) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' stroke='%238b90ab' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 11px center;
  border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-size:12.5px;outline:none;appearance:none;cursor:pointer;
}
select:focus{border-color:#3a3d63}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center;min-height:0}
.chips:empty{display:none}
.fchip{
  display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  background:var(--accent-soft);border:1px solid rgba(255,61,139,.32);color:#ffb3d0;
  border-radius:999px;padding:4px 6px 4px 11px;
}
.fchip button{background:none;border:0;color:inherit;opacity:.7;line-height:1;padding:0 3px;font-size:14px}
.fchip button:hover{opacity:1}
.clearall{background:none;border:0;color:var(--dim);font-size:11.5px;text-decoration:underline;padding:4px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.card:hover{transform:translateY(-2px);border-color:#33365a;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.art{position:relative;height:142px;background:linear-gradient(135deg,#171a2e,#0d0f1c);overflow:hidden}
.art > img{width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:.78;transition:opacity .25s}
.card:hover .art > img{opacity:.94}
.art::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(6,6,11,0) 0%,rgba(6,6,11,.32) 48%,rgba(6,6,11,.82) 78%,var(--panel) 100%);
}
.art .tl,.art .tr{position:absolute;top:10px;z-index:2;display:flex;gap:6px;align-items:center}
.art .tl{left:10px}
.art .tr{right:10px}
.art .bl{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.folder{
  font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  background:rgba(6,6,11,.72);border:1px solid var(--line);color:var(--muted);
  border-radius:6px;padding:5px 7px;backdrop-filter:blur(6px);
}
.lvl{
  font:700 11px/1 var(--mono);background:rgba(6,6,11,.72);border:1px solid var(--line);
  color:var(--text);border-radius:6px;padding:5px 8px;backdrop-filter:blur(6px);
}
.body{padding:13px 14px 14px}
.namerow{display:flex;align-items:center;gap:10px}
.pfp{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);flex:none;object-fit:cover}
.names{min-width:0;flex:1}
.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rid{font:11px/1.35 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:11px;font:11.5px/1 var(--mono);color:var(--muted)}
.stats b{color:var(--text);font-weight:600}
.meta{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft);
}

/* ---------- pills ---------- */
.rank{
  display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:4px 9px 4px 5px;
  font:700 11px/1 var(--sans);letter-spacing:.02em;white-space:nowrap;
  background:rgba(6,6,11,.72);border:1px solid var(--line);backdrop-filter:blur(6px);
}
.rank img{width:16px;height:16px;flex:none}
.rank .lp{font:600 10px/1 var(--mono);color:var(--dim);margin-left:1px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font:600 10.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
  border-radius:6px;padding:4px 7px;border:1px solid transparent;white-space:nowrap;
}
.pill.region{background:rgba(107,140,230,.13);border-color:rgba(107,140,230,.3);color:#9db0f0}
.pill.fa{background:rgba(47,214,163,.13);border-color:rgba(47,214,163,.3);color:#5fe0bb}
.pill.nfa{background:rgba(245,165,36,.13);border-color:rgba(245,165,36,.3);color:#f7bf5e}
.pill.ghost{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--muted)}
.pill.bad{background:rgba(255,77,94,.15);border-color:rgba(255,77,94,.38);color:#ff8f9b}
.pill.warn{background:rgba(245,165,36,.13);border-color:rgba(245,165,36,.32);color:#f7bf5e}
.pill.dormant{background:rgba(255,255,255,.03);border-color:var(--line);color:var(--dim)}
.pill.live{background:rgba(47,214,163,.12);border-color:rgba(47,214,163,.28);color:#5fe0bb}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}

.alarm{
  position:absolute;inset:0 0 auto 0;z-index:3;
  display:flex;align-items:center;gap:7px;
  padding:7px 12px;font:700 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;
  background:linear-gradient(90deg,rgba(255,45,60,.95),rgba(190,25,45,.86));color:#fff;
}
.alarm svg{width:13px;height:13px;fill:currentColor;flex:none}
.card.critical{border-color:rgba(255,77,94,.45)}

/* ---------- list ---------- */
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.list .hdr,.row{
  display:grid;
  grid-template-columns:minmax(190px,1.7fr) 130px 64px 96px 96px 84px 112px 92px 96px;
  gap:12px;align-items:center;padding:0 14px;
}
.list .hdr{
  height:38px;background:var(--panel-2);border-bottom:1px solid var(--line);
  font:700 9.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
}
.row{height:50px;border-bottom:1px solid var(--line-soft);cursor:pointer;font:12px/1 var(--mono)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row.critical{box-shadow:inset 3px 0 0 var(--bad)}
.row .who{display:flex;align-items:center;gap:9px;min-width:0;font-family:var(--sans)}
.row .who img{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);flex:none}
.row .who div{min-width:0}
.row .who .nm{font-size:13px}
.row .who .rid{font-size:10.5px}
.row .num{text-align:right;color:var(--muted)}
.row .num b{color:var(--text);font-weight:600}
.hdr .num{text-align:right}
.scroller{overflow-x:auto}
.scroller>*{min-width:1050px}

/* ---------- detail ---------- */
.backdrop{
  position:fixed;inset:0;z-index:80;background:rgba(3,3,7,.78);
  backdrop-filter:blur(6px);display:grid;place-items:start center;
  padding:34px 18px;overflow-y:auto;
}
.sheet{
  width:min(880px,100%);background:var(--bg-2);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.7);
}
.sheet .banner{position:relative;height:176px;background:linear-gradient(135deg,#171a2e,#0d0f1c)}
.sheet .banner img{width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:.55}
.sheet .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,18,.25),var(--bg-2))}
.sheet .close{
  position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:9px;
  background:rgba(6,6,11,.7);border:1px solid var(--line);color:var(--muted);
  display:grid;place-items:center;font-size:17px;line-height:1;backdrop-filter:blur(6px);
}
.sheet .close:hover{color:var(--text);border-color:#3a3d63}
.sheet .head{position:relative;z-index:2;margin-top:-72px;padding:0 24px;display:flex;gap:16px;align-items:flex-end}
.sheet .head img.big{width:78px;height:78px;border-radius:16px;border:2px solid var(--line);background:var(--panel)}
.sheet .head h2{margin:0 0 4px;font-size:21px;font-weight:800}
.sheet .head .rid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sheet .pills{display:flex;flex-wrap:wrap;gap:7px;padding:16px 24px 0}
.sect{padding:20px 24px;border-top:1px solid var(--line-soft);margin-top:16px}
.sect:first-of-type{margin-top:18px}
.sect h3{
  margin:0 0 13px;font:700 10px/1 var(--sans);letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);
}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px}
.kv div span{display:block;font:700 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.kv div b{font:600 14px/1.2 var(--mono);color:var(--text)}
.ranks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rankcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.rankcard .q{font:700 9.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.rankcard .big{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700}
.rankcard .big img{width:30px;height:30px}
.rankcard .wl{margin-top:9px;font:11.5px/1 var(--mono);color:var(--muted)}
.rankcard .peak{margin-top:7px;font:11px/1.4 var(--mono);color:var(--dim)}
.bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--good)}
.pen{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.pen.crit{border-color:rgba(255,77,94,.4);background:rgba(255,77,94,.07)}
.pen .k{font-weight:700;font-size:13px}
.pen .d{font-size:12px;color:var(--muted);margin-top:2px}
.pen .s{font:11px/1 var(--mono);margin-top:5px;color:var(--dim)}
.pen.crit .s{color:#ff8f9b}
.champs{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto}
.champ{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px 4px 4px;font-size:11.5px}
.champ img{width:22px;height:22px;border-radius:5px}
.champ.hit{border-color:rgba(255,61,139,.45);background:var(--accent-soft)}
.notes{white-space:pre-wrap;font-size:13px;color:var(--muted);line-height:1.6}
.acts{display:flex;flex-wrap:wrap;gap:9px;padding:0 24px 24px}
.btn{
  display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:12.5px;font-weight:600;text-decoration:none;
}
.btn:hover{border-color:#3a3d63;background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#ff5c9d;border-color:#ff5c9d}

/* ---------- misc ---------- */
.empty{text-align:center;padding:76px 20px;color:var(--dim)}
.empty b{display:block;color:var(--muted);font-size:16px;margin-bottom:7px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gatebox{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px;text-align:center}
.gatebox img{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);margin-bottom:16px}
.gatebox h1{margin:0 0 6px;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.gatebox p{margin:0 0 20px;color:var(--dim);font-size:12.5px}
.gatebox input{
  width:100%;height:42px;padding:0 13px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;color:var(--text);font-size:14px;outline:none;text-align:center;margin-bottom:11px;
}
.gatebox input:focus{border-color:var(--accent)}
.gatebox .btn{width:100%;justify-content:center;height:42px}
.gatebox .err{color:var(--bad);font-size:12px;margin-top:11px;min-height:16px}
footer{padding:26px 22px 40px;text-align:center;color:var(--dim);font:11px/1.6 var(--mono);border-top:1px solid var(--line-soft);margin-top:34px}

@media (max-width:640px){
  .hero{padding:26px 16px 20px}
  .wrap{padding:0 16px 48px}
  .controls{margin:0 -16px 16px;padding:14px 16px 12px}
  .grid{grid-template-columns:1fr}
  .sheet .head{flex-direction:column;align-items:flex-start;gap:11px}
}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <form class="gatebox" id="gateform">
    <img src="https://raw.communitydragon.org/latest/game/assets/ux/summonericons/profileicon6923.png" alt="">
    <h1>__LV_TITLE__</h1>
    <p>This vault is locked. Enter the passphrase to read it.</p>
    <input type="password" id="pass" placeholder="Passphrase" autocomplete="current-password" autofocus>
    <button class="btn primary" type="submit" id="unlock">Unlock</button>
    <div class="err" id="gateerr"></div>
  </form>
</div>

<div id="app" hidden>
  <div class="topbar">
    <div class="brand">
      <img src="https://raw.communitydragon.org/latest/game/assets/ux/summonericons/profileicon6923.png" alt="">
      <span>__LV_TITLE__</span>
      <small>Private</small>
    </div>
    <div class="spacer"></div>
    <div class="stamp"><b id="stampCount"></b><span id="stampTime"></span></div>
  </div>

  <div class="hero">
    <h1>My League <em>accounts</em></h1>
    <div class="sub">Every account in the vault &mdash; rank, champion pool, wallet, how long it has sat untouched, and anything currently holding it back. Read out of the League client, published from the Mac.</div>
    <div class="totals" id="totals"></div>
  </div>

  <div class="wrap">
    <div class="controls">
      <div class="searchrow">
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search a name, login, folder or champion — try &ldquo;Viktor&rdquo;" autocomplete="off">
        </label>
        <div class="viewtoggle">
          <button id="vGrid" title="Grid" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
          <button id="vList" title="List" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
        <select id="sort" title="Sort">
          <option value="rank">Highest rank</option>
          <option value="level">Highest level</option>
          <option value="champs">Most champions</option>
          <option value="be">Most blue essence</option>
          <option value="rp">Most RP</option>
          <option value="recent">Recently played</option>
          <option value="idle">Longest idle</option>
          <option value="name">Name A&ndash;Z</option>
          <option value="folder">Folder</option>
        </select>
      </div>
      <div class="filters">
        <select id="fFolder"></select>
        <select id="fRegion"></select>
        <select id="fTier"></select>
        <select id="fAccess"></select>
        <select id="fStatus"></select>
        <select id="fIdle"></select>
        <select id="fPlayer"></select>
        <select id="fChamp"></select>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div id="results"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script id="vaultdata" type="application/json">__LV_PAYLOAD__</script>
<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  Constants
 * ------------------------------------------------------------------ */
const CD = "https://raw.communitydragon.org/latest";
const GD = CD + "/plugins/rcp-be-lol-game-data/global/default";
const CREST = t =>
  CD + "/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-mini-crests/"
  + String(t || "unranked").toLowerCase() + ".svg";
const TIERS = ["UNRANKED","IRON","BRONZE","SILVER","GOLD","PLATINUM","EMERALD","DIAMOND","MASTER","GRANDMASTER","CHALLENGER"];
const DIVS  = ["I","II","III","IV"];
const APEX  = new Set(["MASTER","GRANDMASTER","CHALLENGER"]);
const tierVar = t => "var(--" + String(t || "unranked").toLowerCase() + ")";

let VAULT = null;        // decoded payload
let champById = {};      // 112 -> { name, alias }
let champByName = {};    // "Kai'Sa" -> { id, alias }

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
const $  = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (n == null ? "—" : Number(n).toLocaleString("en-US"));

function ladder(tier, div) {
  if (!tier || tier === "UNRANKED") return 0;
  const ti = TIERS.indexOf(tier);
  if (ti < 0) return 0;
  const di = APEX.has(tier) ? 4 : 4 - Math.max(0, DIVS.indexOf(div || "IV"));
  return ti * 10 + di;
}
function rankText(r) {
  if (!r || !r.tier || r.tier === "UNRANKED") return "Unranked";
  const t = r.tier[0] + r.tier.slice(1).toLowerCase();
  return APEX.has(r.tier) ? t : t + " " + r.div;
}
function peakText(r) {
  if (!r || !r.peakTier || r.peakTier === "UNRANKED") return null;
  const t = r.peakTier[0] + r.peakTier.slice(1).toLowerCase();
  return APEX.has(r.peakTier) ? t : t + " " + r.peakDiv;
}
function daysSince(iso) {
  if (!iso) return null;
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
}
function ago(iso) {
  const d = daysSince(iso);
  if (d == null) return "never";
  if (d === 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 30) return d + " days ago";
  if (d < 365) {
    const m = Math.round(d / 30);
    return m + (m === 1 ? " month ago" : " months ago");
  }
  return (d / 365).toFixed(1) + " years ago";
}
function iconURL(id) {
  return CD + "/game/assets/ux/summonericons/profileicon" + (id == null ? 29 : id) + ".png";
}
/* The champion whose art fronts the card: the one last played, else a stable pick out
   of the pool, so a card keeps the same face from one publish to the next. */
function faceChampionId(a) {
  if (a.lastGame) {
    if (a.lastGame.championId != null) return a.lastGame.championId;
    const known = champByName[a.lastGame.champion];
    if (known) return known.id;
  }
  if (a.champions && a.champions.length) {
    let h = 0;
    for (const ch of a.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return a.champions[h % a.champions.length].id;
  }
  return null;
}
/* Splash art comes from Data Dragon, whose path carries no patch number and whose key
   is exactly the alias CommunityDragon reports. CommunityDragon's own splash files are
   named inconsistently for a handful of champions, so they are not used here. */
function splashURL(id) {
  const c = id == null ? null : champById[id];
  return c ? "https://ddragon.leagueoflegends.com/cdn/img/champion/splash/" + c.alias + "_0.jpg" : null;
}
function squareURL(id) {
  return id == null ? null : GD + "/v1/champion-icons/" + id + ".png";
}

/* ------------------------------------------------------------------ *
 *  Unlock gate — PBKDF2-HMAC-SHA256 + AES-256-GCM, same as the backups
 * ------------------------------------------------------------------ */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decryptPayload(env, passphrase) {
  const salt  = b64(env.salt);
  const boxed = b64(env.payload);          // nonce(12) + ciphertext + tag(16)
  const base  = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveBits"]);
  const bits  = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: env.iterations }, base, 256);
  const key   = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: boxed.slice(0, 12) }, key, boxed.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ------------------------------------------------------------------ *
 *  Champion lookups (cached in this browser, never on the server)
 * ------------------------------------------------------------------ */
function indexChampions(list) {
  champById = {}; champByName = {};
  for (const c of list) {
    if (!c || c.id == null || c.id < 0 || !c.alias) continue;
    // Skip the alternate-universe duplicates that share a name with a real champion.
    if (champByName[c.name] && c.id > 1000) continue;
    champById[c.id] = { name: c.name, alias: c.alias };
    champByName[c.name] = { id: c.id, alias: c.alias };
  }
}
async function loadChampions() {
  try {
    const cached = JSON.parse(localStorage.getItem("lv.champs") || "null");
    if (cached && Date.now() - cached.at < 7 * 86400000) { indexChampions(cached.list); return; }
  } catch (e) {}
  try {
    const list = await (await fetch(GD + "/v1/champion-summary.json")).json();
    indexChampions(list);
    const slim = list.map(c => ({ id: c.id, name: c.name, alias: c.alias }));
    try { localStorage.setItem("lv.champs", JSON.stringify({ at: Date.now(), list: slim })); } catch (e) {}
  } catch (e) {
    /* offline or blocked — names still render, the art falls back to a gradient */
  }
}

/* ------------------------------------------------------------------ *
 *  Filter state
 * ------------------------------------------------------------------ */
const FILTER_KEYS = ["q", "folder", "region", "tier", "access", "status", "idle", "player", "champ"];
const state = {
  q: "", folder: "", region: "", tier: "", access: "", status: "", idle: "", player: "", champ: "",
  sort: localStorage.getItem("lv.sort") || "rank",
  view: localStorage.getItem("lv.view") || "grid"
};
const UNFILED = "␀unfiled";

function option(v, label) { const o = document.createElement("option"); o.value = v; o.textContent = label; return o; }

function fillSelects(accounts) {
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));

  const folders = uniq(accounts.map(a => a.folder));
  $("#fFolder").replaceChildren(option("", "All folders"), ...folders.map(f => option(f, f)),
    ...(accounts.some(a => !a.folder) ? [option(UNFILED, "Unfiled")] : []));

  $("#fRegion").replaceChildren(option("", "All servers"),
    ...uniq(accounts.map(a => a.region.short)).map(r => option(r, r)));

  const present = TIERS.filter(t => accounts.some(a => a.ranks.solo.tier === t || a.ranks.flex.tier === t));
  $("#fTier").replaceChildren(option("", "Any rank"),
    ...present.map(t => option(t, t === "UNRANKED" ? "Unranked" : t[0] + t.slice(1).toLowerCase())),
    option("__ranked", "Ranked this split"));

  $("#fAccess").replaceChildren(option("", "FA / NFA — any"), option("FA", "FA — full access"),
    option("NFA", "NFA — no email"), option("__none", "Not recorded"));

  $("#fStatus").replaceChildren(option("", "Any status"), option("__clean", "Nothing wrong"),
    option("__any", "Has a penalty"), option("__crit", "Blocked from playing"),
    option("__delay", "Queue delay"), option("__dodge", "Dodge timer"),
    option("__ban", "Suspended or banned"));

  $("#fIdle").replaceChildren(option("", "Any idle time"),
    option("__7", "Idle under a week"), option("__30", "Idle over a month"),
    option("__90", "Idle over 3 months"), option("__365", "Idle over a year"),
    option("__never", "Never played"));

  $("#fPlayer").replaceChildren(option("", "Played by anyone"),
    option("ME", "Last played by me"), option("SOMEONE_ELSE", "Last played by someone else"),
    option("__unsaid", "Not said who played"));

  $("#fChamp").replaceChildren(option("", "Any champion"),
    ...uniq(accounts.flatMap(a => a.champions.map(c => c.name))).map(c => option(c, c)));
}

/* ------------------------------------------------------------------ *
 *  Filtering + sorting
 * ------------------------------------------------------------------ */
function matches(a) {
  const q = state.q.trim().toLowerCase();
  if (q) {
    const hay = [a.name, a.riotId, a.login, a.folder, a.region.short, a.region.long, a.notes,
                 rankText(a.ranks.solo), rankText(a.ranks.flex), a.access,
                 a.lastGame && a.lastGame.champion]
      .concat(a.champions.map(c => c.name))
      .filter(Boolean).join(" ").toLowerCase();
    if (!q.split(/\s+/).every(term => hay.includes(term))) return false;
  }
  if (state.folder) {
    if (state.folder === UNFILED) { if (a.folder) return false; }
    else if (a.folder !== state.folder) return false;
  }
  if (state.region && a.region.short !== state.region) return false;
  if (state.tier) {
    if (state.tier === "__ranked") {
      if (a.ranks.solo.tier === "UNRANKED" && a.ranks.flex.tier === "UNRANKED") return false;
    } else if (a.ranks.solo.tier !== state.tier && a.ranks.flex.tier !== state.tier) return false;
  }
  if (state.access) {
    if (state.access === "__none") { if (a.access) return false; }
    else if (a.access !== state.access) return false;
  }
  if (state.status) {
    const live = a.penalties.filter(p => p.active);
    if (state.status === "__clean" && live.length) return false;
    if (state.status === "__any"   && !live.length) return false;
    if (state.status === "__crit"  && !live.some(p => p.critical)) return false;
    if (state.status === "__delay" && !live.some(p => p.kind === "Queue delay")) return false;
    if (state.status === "__dodge" && !live.some(p => p.kind === "Dodge timer")) return false;
    if (state.status === "__ban"   && !live.some(p => p.kind === "Temporary suspension" || p.kind === "Permanent ban")) return false;
  }
  if (state.idle) {
    if (state.idle === "__never") {
      if (a.idleDays != null) return false;
    } else {
      if (a.idleDays == null) return false;
      const min = Number(state.idle.slice(2));
      if (min === 7 ? a.idleDays >= 7 : a.idleDays < min) return false;
    }
  }
  if (state.player) {
    const who = a.lastGame && a.lastGame.player;
    if (state.player === "__unsaid") { if (who) return false; }
    else if (who !== state.player) return false;
  }
  if (state.champ && !a.champions.some(c => c.name === state.champ)) return false;
  return true;
}

function bestLadder(a) {
  return Math.max(ladder(a.ranks.solo.tier, a.ranks.solo.div), ladder(a.ranks.flex.tier, a.ranks.flex.div));
}
function sortKey(a) {
  switch (state.sort) {
    case "level":  return -(a.level || 0);
    case "champs": return -a.champions.length;
    case "be":     return -(a.be || 0);
    case "rp":     return -(a.rp || 0);
    case "idle":   return -(a.idleDays == null ? -1 : a.idleDays);
    case "recent": return -(a.lastGame ? new Date(a.lastGame.playedAt).getTime() : 0);
    case "name":   return a.name.toLowerCase();
    case "folder": return (a.folder || "zzzz") + " " + a.name.toLowerCase();
    default:       return -(bestLadder(a) * 1e6 + (a.level || 0));
  }
}
function visible() {
  const rows = VAULT.accounts.filter(matches);
  rows.sort((x, y) => {
    const a = sortKey(x), b = sortKey(y);
    return typeof a === "string" ? a.localeCompare(b) : a - b;
  });
  return rows;
}

/* ------------------------------------------------------------------ *
 *  Rendering
 * ------------------------------------------------------------------ */
function rankPill(r) {
  if (!r) return "";
  const t = r.tier || "UNRANKED";
  const lp = t !== "UNRANKED" ? '<span class="lp">' + r.lp + ' LP</span>' : "";
  return '<span class="rank" style="color:' + tierVar(t) + '">'
       + '<img src="' + CREST(t) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
       + esc(rankText(r)) + lp + '</span>';
}

function statusPills(a) {
  const live = a.penalties.filter(p => p.active);
  if (!live.length) return '<span class="pill live"><span class="dot"></span>Clear</span>';
  const out = [];
  for (const p of live.filter(p => p.critical).slice(0, 2))
    out.push('<span class="pill bad"><span class="dot"></span>' + esc(p.kind) + '</span>');
  for (const p of live.filter(p => !p.critical).slice(0, 2))
    out.push('<span class="pill warn">' + esc(p.kind) + '</span>');
  return out.join("");
}
function accessPill(a) {
  if (a.access === "FA")  return '<span class="pill fa">FA</span>';
  if (a.access === "NFA") return '<span class="pill nfa">NFA</span>';
  return "";
}
/* Days since anyone played it. Greyed out when the account's owner played that game
   himself — the number then says nothing about whether anyone else has been on it. */
function idlePill(a) {
  if (a.idleDays == null) return '<span class="pill dormant">Never played</span>';
  const mine = a.lastGame && a.lastGame.player === "ME";
  const label = a.idleDays === 0 ? "Played today"
              : a.idleDays === 1 ? "1 day idle"
              : a.idleDays < 365 ? a.idleDays + " days idle"
              : (a.idleDays / 365).toFixed(1) + " years idle";
  const cls = mine ? "dormant" : (a.idleDays >= 90 ? "warn" : "ghost");
  return '<span class="pill ' + cls + '" title="' + esc(idleTitle(a)) + '">'
       + (mine ? "\u25CF " : "") + esc(label) + '</span>';
}
function idleTitle(a) {
  if (a.idleDays == null) return "No game on record for this account.";
  const who = a.lastGame && a.lastGame.player;
  const base = a.idleDays === 0 ? "Last game was today"
             : a.idleDays === 1 ? "Last game was yesterday"
             : "Last game was " + a.idleDays + " days ago";
  if (who === "ME") return base + ", played by you — so this says nothing about whether anyone else has been on it.";
  if (who === "SOMEONE_ELSE") return base + ", played by someone else.";
  return base + ". Who played it has not been recorded.";
}

function card(a) {
  const art = splashURL(faceChampionId(a));
  const crit = a.penalties.find(p => p.active && p.critical);
  const node = el("div", "card" + (crit ? " critical" : ""));
  node.dataset.id = a.id;
  node.innerHTML =
    '<div class="art">'
    + (art ? '<img src="' + art + '" alt="" loading="lazy" onerror="this.remove()">' : "")
    + (crit ? '<div class="alarm"><svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 6l.9 7h-1.8L12 8zm0 9.6a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z"/></svg>'
              + esc(crit.kind) + ' · ' + esc(crit.status) + '</div>' : "")
    + '<div class="tl">' + (a.folder ? '<span class="folder">' + esc(a.folder) + '</span>' : "") + '</div>'
    + '<div class="tr">' + (a.level ? '<span class="lvl">LVL ' + a.level + '</span>' : "") + '</div>'
    + '<div class="bl">' + rankPill(a.ranks.solo)
    + (a.ranks.flex.tier !== "UNRANKED" ? rankPill(a.ranks.flex) : "") + '</div>'
    + '</div>'
    + '<div class="body">'
    + '<div class="namerow">'
    + '<img class="pfp" src="' + iconURL(a.iconId) + '" alt="" loading="lazy">'
    + '<div class="names"><div class="nm">' + esc(a.name) + '</div>'
    + '<div class="rid">' + esc(a.riotId || a.login || "not signed in yet") + '</div></div>'
    + '</div>'
    + '<div class="stats">'
    + '<span><b>' + a.champions.length + '</b> champs</span>'
    + '<span><b>' + num(a.be) + '</b> BE</span>'
    + '<span><b>' + num(a.rp) + '</b> RP</span>'
    + (a.lastGame ? '<span><b>' + esc(a.lastGame.champion) + '</b> ' + esc(ago(a.lastGame.playedAt))
                    + (a.lastGame.player === "ME" ? " · you"
                       : a.lastGame.player === "SOMEONE_ELSE" ? " · someone else" : "") + '</span>'
                  : '<span>no game recorded</span>')
    + '</div>'
    + '<div class="meta"><span class="pill region">' + esc(a.region.short) + '</span>'
    + accessPill(a) + idlePill(a) + statusPills(a) + '</div>'
    + '</div>';
  node.addEventListener("click", () => openSheet(a.id));
  return node;
}

function row(a) {
  const crit = a.penalties.find(p => p.active && p.critical);
  const node = el("div", "row" + (crit ? " critical" : ""));
  node.dataset.id = a.id;
  node.innerHTML =
    '<div class="who"><img src="' + iconURL(a.iconId) + '" alt="" loading="lazy">'
    + '<div><div class="nm">' + esc(a.name) + '</div>'
    + '<div class="rid">' + esc(a.riotId || a.login || "—") + '</div></div></div>'
    + '<div>' + rankPill(a.ranks.solo) + '</div>'
    + '<div class="num"><b>' + (a.level || "—") + '</b></div>'
    + '<div class="num"><b>' + a.champions.length + '</b> champs</div>'
    + '<div class="num"><b>' + num(a.be) + '</b> BE</div>'
    + '<div class="num"><b>' + num(a.rp) + '</b> RP</div>'
    + '<div class="num">' + (a.idleDays == null ? "—"
        : '<b>' + a.idleDays + '</b> days'
          + (a.lastGame && a.lastGame.player === "ME" ? ' <span style="opacity:.6">you</span>' : "")) + '</div>' 
    + '<div>' + (crit ? '<span class="pill bad"><span class="dot"></span>' + esc(crit.kind) + '</span>'
                      : (a.penalties.some(p => p.active) ? '<span class="pill warn">Penalty</span>'
                                                         : '<span class="pill live">Clear</span>')) + '</div>'
    + '<div style="display:flex;gap:5px;justify-content:flex-end">'
    + '<span class="pill region">' + esc(a.region.short) + '</span>' + accessPill(a) + '</div>';
  node.addEventListener("click", () => openSheet(a.id));
  return node;
}

function render() {
  const rows = visible();
  const host = $("#results");
  host.replaceChildren();

  if (!rows.length) {
    host.append(el("div", "empty", "<b>Nothing matches</b>Loosen a filter, or clear the search."));
  } else if (state.view === "list") {
    const scroller = el("div", "scroller");
    const list = el("div", "list");
    list.append(el("div", "hdr",
      '<div>Account</div><div>Solo/Duo</div><div class="num">Level</div><div class="num">Champions</div>'
      + '<div class="num">Blue essence</div><div class="num">RP</div><div class="num">Idle</div>'
      + '<div>Status</div><div style="text-align:right">Server</div>'));
    for (const a of rows) list.append(row(a));
    scroller.append(list);
    host.append(scroller);
  } else {
    const grid = el("div", "grid");
    for (const a of rows) grid.append(card(a));
    host.append(grid);
  }

  $("#stampCount").textContent = rows.length + " of " + VAULT.accounts.length + " accounts";
  renderChips();
}

const CHIP_LABEL = {
  q: "Search", folder: "Folder", region: "Server", tier: "Rank",
  access: "Access", status: "Status", idle: "Idle", player: "Last played by", champ: "Champion"
};
const CHIP_VALUE = {
  "__ranked": "Ranked", "__none": "Not recorded", "__clean": "Nothing wrong",
  "__any": "Has a penalty", "__crit": "Blocked", "__delay": "Queue delay",
  "__dodge": "Dodge timer", "__ban": "Suspended",
  "__7": "Under a week", "__30": "Over a month", "__90": "Over 3 months",
  "__365": "Over a year", "__never": "Never played",
  "ME": "Me", "SOMEONE_ELSE": "Someone else", "__unsaid": "Not said"
};
CHIP_VALUE[UNFILED] = "Unfiled";

function renderChips() {
  const box = $("#chips");
  box.replaceChildren();
  let any = false;
  for (const k of FILTER_KEYS) {
    if (!state[k]) continue;
    any = true;
    const chip = el("span", "fchip",
      esc(CHIP_LABEL[k]) + ": " + esc(CHIP_VALUE[state[k]] || state[k]) + ' <button type="button" aria-label="Remove">&times;</button>');
    chip.querySelector("button").addEventListener("click", () => {
      state[k] = "";
      if (k === "q") $("#q").value = "";
      syncSelects(); render();
    });
    box.append(chip);
  }
  if (any) {
    const clear = el("button", "clearall", "Clear everything");
    clear.addEventListener("click", () => {
      for (const k of FILTER_KEYS) state[k] = "";
      $("#q").value = ""; syncSelects(); render();
    });
    box.append(clear);
  }
}

function syncSelects() {
  $("#fFolder").value = state.folder; $("#fRegion").value = state.region;
  $("#fTier").value = state.tier;     $("#fAccess").value = state.access;
  $("#fStatus").value = state.status; $("#fIdle").value = state.idle;
  $("#fPlayer").value = state.player; $("#fChamp").value = state.champ;
  $("#sort").value = state.sort;
}

/* ------------------------------------------------------------------ *
 *  Detail sheet
 * ------------------------------------------------------------------ */
function rankCard(label, r) {
  const t = r.tier || "UNRANKED";
  const games = (r.wins || 0) + (r.losses || 0);
  const wr = games ? Math.round((r.wins / games) * 100) : null;
  const pk = peakText(r);
  return '<div class="rankcard"><div class="q">' + esc(label) + '</div>'
    + '<div class="big" style="color:' + tierVar(t) + '">'
    + '<img src="' + CREST(t) + '" alt="" onerror="this.style.display=\'none\'">'
    + '<span>' + esc(rankText(r)) + '</span>'
    + (t !== "UNRANKED" ? '<span style="color:var(--muted);font:600 12px var(--mono)">' + r.lp + ' LP</span>' : "")
    + '</div>'
    + (games ? '<div class="wl">' + r.wins + 'W ' + r.losses + 'L · ' + wr + '% over ' + games + ' games</div>'
               + '<div class="bar"><i style="width:' + wr + '%"></i></div>'
             : '<div class="wl">no games this split</div>')
    + (pk ? '<div class="peak">Peak ' + esc(pk) + (r.peakNote ? " · " + esc(r.peakNote) : "") + '</div>' : "")
    + '</div>';
}

function openSheet(id) {
  const a = VAULT.accounts.find(x => x.id === id);
  if (!a) return;
  const art = splashURL(faceChampionId(a));
  const live = a.penalties.filter(p => p.active);
  const done = a.penalties.filter(p => !p.active);
  const q = state.q.trim().toLowerCase();

  const back = el("div", "backdrop");
  back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">'
    + '<div class="banner">'
    + (art ? '<img src="' + art + '" alt="" onerror="this.remove()">' : "")
    + '<button class="close" type="button" aria-label="Close">&times;</button></div>'
    + '<div class="head"><img class="big" src="' + iconURL(a.iconId) + '" alt="">'
    + '<div><h2>' + esc(a.name) + '</h2>'
    + '<div class="rid">' + esc(a.riotId || a.login || "not signed in yet") + '</div></div></div>'
    + '<div class="pills">'
    + '<span class="pill region">' + esc(a.region.short) + ' · ' + esc(a.region.long) + '</span>'
    + (a.folder ? '<span class="pill ghost">' + esc(a.folder) + '</span>' : "")
    + accessPill(a) + idlePill(a)
    + (a.level ? '<span class="pill ghost">Level ' + a.level + '</span>' : "")
    + (a.honor != null ? '<span class="pill ghost">Honor ' + a.honor + '</span>' : "")
    + '</div>'

    + '<div class="sect"><h3>Ranked</h3><div class="ranks">'
    + rankCard("Solo / Duo", a.ranks.solo) + rankCard("Flex", a.ranks.flex) + '</div></div>'

    + '<div class="sect"><h3>Account</h3><div class="kv">'
    + '<div><span>Blue essence</span><b>' + num(a.be) + '</b></div>'
    + '<div><span>Riot points</span><b>' + num(a.rp) + '</b></div>'
    + '<div><span>Champions</span><b>' + a.champions.length + '</b></div>'
    + '<div><span>Days idle</span><b>' + (a.idleDays == null ? "—" : a.idleDays) + '</b></div>' 
    + '<div><span>Last game</span><b>' + (a.lastGame ? esc(ago(a.lastGame.playedAt)) : "—") + '</b></div>'
    + '<div><span>Last refreshed</span><b>' + (a.lastRefreshed ? esc(ago(a.lastRefreshed)) : "never") + '</b></div>'
    + '</div></div>'

    + (a.lastGame ? '<div class="sect"><h3>Last game</h3><div class="kv">'
        + '<div><span>Champion</span><b>' + esc(a.lastGame.champion || "—") + '</b></div>'
        + '<div><span>Queue</span><b>' + esc(a.lastGame.queue || "—") + '</b></div>'
        + '<div><span>Result</span><b style="color:'
          + (a.lastGame.result === "Victory" ? "var(--good)" : a.lastGame.result === "Defeat" ? "var(--bad)" : "var(--muted)")
          + '">' + esc(a.lastGame.result) + '</b></div>'
        + '<div><span>KDA</span><b>' + esc(a.lastGame.kda) + '</b></div>'
        + '<div><span>Length</span><b>' + esc(a.lastGame.duration) + '</b></div>'
        + '<div><span>Played</span><b>' + esc(ago(a.lastGame.playedAt)) + '</b></div>'
        + '<div><span>Played by</span><b>'
          + (a.lastGame.player === "ME" ? "You"
             : a.lastGame.player === "SOMEONE_ELSE" ? "Someone else" : "—") + '</b></div>' 
        + '</div></div>' : "")

    + '<div class="sect"><h3>Penalties</h3>'
    + (live.length || done.length ? "" : '<div style="color:var(--dim);font-size:12.5px">Nothing on record. This account is clear.</div>')
    + live.map(p => '<div class="pen ' + (p.critical ? "crit" : "") + '"><div style="flex:1">'
        + '<div class="k" style="color:' + (p.critical ? "var(--bad)" : "var(--warn)") + '">' + esc(p.kind) + '</div>'
        + (p.detail ? '<div class="d">' + esc(p.detail) + '</div>' : "")
        + '<div class="s">' + esc(p.status) + (p.source === "client" ? " · read from the client" : "") + '</div>'
        + '</div></div>').join("")
    + (done.length ? '<div style="color:var(--dim);font-size:11.5px;margin-top:11px">Served: '
        + done.map(p => esc(p.kind)).join(", ") + '</div>' : "")
    + '</div>'

    + (a.champions.length ? '<div class="sect"><h3>Champion pool — ' + a.champions.length + '</h3><div class="champs">'
        + a.champions.map(c => {
            const hit = (q && c.name.toLowerCase().includes(q)) || (state.champ && c.name === state.champ);
            const sq = squareURL(c.id);
            return '<span class="champ' + (hit ? " hit" : "") + '">'
              + (sq ? '<img src="' + sq + '" alt="" loading="lazy" onerror="this.remove()">' : "")
              + esc(c.name) + '</span>';
          }).join("")
        + '</div></div>' : "")

    + (a.notes ? '<div class="sect"><h3>Notes</h3><div class="notes">' + esc(a.notes) + '</div></div>' : "")

    + '<div class="acts">'
    + (a.ugg ? '<a class="btn primary" href="' + esc(a.ugg) + '" target="_blank" rel="noreferrer noopener">Open on u.gg</a>' : "")
    + (a.riotId ? '<button class="btn" type="button" data-copy="' + esc(a.riotId) + '">Copy Riot ID</button>' : "")
    + (a.login ? '<button class="btn" type="button" data-copy="' + esc(a.login) + '">Copy login</button>' : "")
    + '</div></div>';

  const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  back.addEventListener("click", e => { if (e.target === back) close(); });
  back.querySelector(".close").addEventListener("click", close);
  document.addEventListener("keydown", onKey);
  back.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(b.dataset.copy);
      const t = b.textContent; b.textContent = "Copied";
      setTimeout(() => { b.textContent = t; }, 1200);
    } catch (e) {}
  }));
  document.body.append(back);
}

/* ------------------------------------------------------------------ *
 *  Totals + boot
 * ------------------------------------------------------------------ */
function renderTotals() {
  const A = VAULT.accounts;
  const sum = k => A.reduce((n, a) => n + (a[k] || 0), 0);
  let best = null, bestP = -1;
  for (const a of A) { const p = bestLadder(a); if (p > bestP) { bestP = p; best = a; } }
  const bestRank = best
    ? rankText(ladder(best.ranks.solo.tier, best.ranks.solo.div) >= ladder(best.ranks.flex.tier, best.ranks.flex.div)
        ? best.ranks.solo : best.ranks.flex)
    : "—";
  const blocked = A.filter(a => a.penalties.some(p => p.active && p.critical)).length;
  const pool = new Set(A.flatMap(a => a.champions.map(c => c.name))).size;
  // Games you played yourself are left out: they say nothing about an account sitting.
  const idle = A.filter(a => a.idleDays != null && !(a.lastGame && a.lastGame.player === "ME"))
                .map(a => a.idleDays);
  const longest = idle.length ? Math.max(...idle) : null;

  const items = [
    ["Accounts", A.length, false],
    ["Best rank", bestRank, false],
    ["Blue essence", num(sum("be")), false],
    ["Riot points", num(sum("rp")), false],
    ["Champions seen", pool, false],
    ["Longest idle", longest == null ? "—" : longest + "d", false],
    ["Blocked right now", blocked, blocked > 0]
  ];
  $("#totals").replaceChildren(...items.map(([k, v, alarm]) => {
    const d = el("div", "total");
    d.innerHTML = "<b" + (alarm ? ' style="color:var(--bad)"' : "") + ">" + esc(v) + "</b><span>" + esc(k) + "</span>";
    return d;
  }));
}

function wire() {
  $("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
  const bind = (sel, key) => $(sel).addEventListener("change", e => { state[key] = e.target.value; render(); });
  bind("#fFolder", "folder"); bind("#fRegion", "region"); bind("#fTier", "tier");
  bind("#fAccess", "access"); bind("#fStatus", "status"); bind("#fIdle", "idle");
  bind("#fPlayer", "player"); bind("#fChamp", "champ");
  $("#sort").addEventListener("change", e => {
    state.sort = e.target.value;
    try { localStorage.setItem("lv.sort", state.sort); } catch (err) {}
    render();
  });

  const setView = v => {
    state.view = v;
    try { localStorage.setItem("lv.view", v); } catch (err) {}
    $("#vGrid").classList.toggle("on", v === "grid");
    $("#vList").classList.toggle("on", v === "list");
    render();
  };
  $("#vGrid").addEventListener("click", () => setView("grid"));
  $("#vList").addEventListener("click", () => setView("list"));
  $("#vGrid").classList.toggle("on", state.view === "grid");
  $("#vList").classList.toggle("on", state.view === "list");

  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  });
}

async function start(payload) {
  VAULT = payload;
  $("#gate").hidden = true;
  $("#app").hidden = false;

  const when = new Date(VAULT.publishedAt);
  $("#stampTime").textContent = "published " + when.toLocaleString();
  $("#foot").textContent = VAULT.accounts.length + " accounts · published from " + VAULT.origin
    + " on " + when.toLocaleString() + " · generated by League Vault, and holds no passwords";

  fillSelects(VAULT.accounts);
  syncSelects();
  wire();
  renderTotals();
  render();

  await loadChampions();
  render();                    // second pass, now that champion art can resolve
}

(function boot() {
  let raw;
  try { raw = JSON.parse(document.getElementById("vaultdata").textContent); }
  catch (e) {
    document.body.innerHTML = '<div class="empty"><b>No data</b>This page was published without a payload.</div>';
    return;
  }
  if (!raw || !raw.locked) { start(raw); return; }

  $("#gate").hidden = false;
  $("#gateform").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#unlock"), err = $("#gateerr");
    btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
    try {
      start(await decryptPayload(raw, $("#pass").value));
    } catch (ex) {
      err.textContent = "Wrong passphrase.";
      btn.disabled = false; btn.textContent = "Unlock";
      $("#pass").select();
    }
  });
})();
</script>
